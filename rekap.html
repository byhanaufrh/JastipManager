<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekapan Pesanan | Jastip Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
 :root{--bg:#fff8f6;--card:#fffdfb;--ink:#3b2d32;--muted:#8b777d;--accent:#b65f7b;--accent-soft:#fce8ef;--line:#f2dfe5;--green:#e7f6ed;--red:#fde9eb;--yellow:#fff4d9;--blue:#eaf1ff;--shadow:0 10px 28px rgba(151,86,109,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,rgba(249,211,225,.62),transparent 330px),linear-gradient(180deg,#fff0f4 0,#fff8f6 250px,var(--bg) 250px);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(100%,700px);margin:0 auto;padding:24px 16px 36px}.brand{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:1.8px;font-weight:900;color:var(--accent);background:rgba(255,255,255,.72);border:1px solid rgba(182,95,123,.14);padding:8px 11px;border-radius:999px}h1{font-size:clamp(24px,6vw,30px);letter-spacing:-.7px;line-height:1.15;margin:15px 0 7px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0}.card{background:var(--card);border:1px solid rgba(182,95,123,.14);border-radius:22px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}.event{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:7px 10px;border-radius:9px}.greeting{font-size:20px;line-height:1.25;letter-spacing:-.3px;margin:14px 0 5px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px}.summary-box{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fffdfa;min-width:0}.summary-box.total{grid-column:1/-1;background:linear-gradient(135deg,#c46e8c,#a84e70);color:white;border:0;padding:16px}.sum-label{font-size:11px;line-height:1.35;color:var(--muted);margin-bottom:6px}.total .sum-label{color:#ffeaf1}.sum-value{font-size:17px;font-weight:850;letter-spacing:-.3px;overflow-wrap:anywhere}.total .sum-value{font-size:25px}.section-label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:850;margin:22px 0 3px}.item{padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:2px}.itemhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.itemname{font-weight:800;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.itemprice{font-weight:850;font-size:13px;color:var(--accent);text-align:right;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.itembottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.subtotal{font-size:12px;color:var(--muted);text-align:right}.subtotal b{display:block;color:var(--ink);font-size:13px;margin-top:2px}.pill{display:inline-block;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;line-height:1.35;max-width:100%}.good{background:var(--green);color:#277146}.wait{background:var(--yellow);color:#8b6815}.bad{background:var(--red);color:#9a4139}.ship{background:var(--blue);color:#3f6194}.error{padding:18px;background:#fff;border-radius:14px;color:#8a3d37;line-height:1.5}.foot{margin-top:18px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6;padding:0 8px}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
@media(min-width:560px){.wrap{padding-top:32px}.card{padding:24px}.summary{grid-template-columns:1fr 1fr 1.25fr}.summary-box.total{grid-column:auto}.total .sum-value{font-size:21px}}
@media(max-width:380px){.wrap{padding:18px 12px 28px}.card{padding:14px;border-radius:18px}.itemhead{gap:8px}.itemprice{font-size:12px}.sum-value{font-size:15px}.total .sum-value{font-size:22px}}
</style></head><body><main class="wrap"><div class="brand">JASTIP MANAGER</div><h1>Rekapan Pesanan</h1><div class="sub">Link pribadi ini menampilkan pesanan kamu dari beberapa event sekaligus.</div><div id="content" class="card">Memuat rekapan…</div><div class="foot">Jika status belum berubah, muat ulang halaman ini untuk melihat data terbaru.</div></main><script>
const SUPABASE_URL='https://aewcrqgknlntmacrlvhd.supabase.co';const KEY='sb_publishable_30ODyszcxUi54JJyYByfdQ_q_RCEysm';
const statusLabel={'Request':'Menunggu konfirmasi / masih dicari','PO':'Menunggu konfirmasi / masih dicari','Dapat':'Berhasil didapat','Tidak Dapat':'Tidak berhasil didapat / sold out','OTW ke Aku':'Dalam perjalanan ke jastiper','Ready':'Barang sudah sampai di jastiper','Sent':'Sudah dikirim','Completed':'Selesai','Cancelled':'Dibatalkan'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
function cls(s){if(['Dapat','Ready','Completed'].includes(s))return'good';if(['Tidak Dapat','Cancelled'].includes(s))return'bad';if(['OTW ke Aku','Sent'].includes(s))return'ship';return'wait'}
function renderRecap(data){
 const host=document.getElementById('content');
 // Supports multi-event payload {events:[{event_name,orders}], ...} and legacy single-event payload.
 const groups=Array.isArray(data.events)&&data.events.length?data.events:[{event_name:data.event_name||'PO',orders:data.orders||[]}];
 const allOrders=groups.flatMap(g=>(g.orders||[]).map(o=>({...o,_event_name:g.event_name||g.name||'PO'})));
 const counted=allOrders.filter(o=>!['Cancelled','Tidak Dapat','Sold'].includes(o.status));
 const priced=counted.filter(o=>Number(o.price)>0);
 const goods=priced.reduce((sum,o)=>sum+(Number(o.price)||0)*Math.max(1,Number(o.qty)||1),0);
 const fees=counted.reduce((sum,o)=>sum+Math.max(0,Number(o.fee)||0),0);
 const paid=Math.max(0,Number(data.paid_total ?? data.total_paid ?? allOrders.reduce((sum,o)=>sum+Math.max(0,Number(o.paid)||0),0))||0);
 const shippingKnown=data.shipping_total!==undefined&&data.shipping_total!==null;
 const shipping=shippingKnown?Math.max(0,Number(data.shipping_total)||0):allOrders.reduce((sum,o)=>sum+Math.max(0,Number(o.ship)||0),0);
 const allShippingKnown=shippingKnown||allOrders.every(o=>o.ship!==undefined&&o.ship!==null);
 const missingPrice=counted.some(o=>!(Number(o.price)>0));
 const finalKnown=data.total_final!==undefined&&data.total_final!==null?Boolean(data.total_is_final!==false):Boolean(data.total_is_final);
 const total=goods+fees+(allShippingKnown?shipping:0);
 const balance=Math.max(0,total-paid);
 const summary='<div class="summary">'+
   '<div class="summary-box total"><div class="sum-label">'+(finalKnown?'Total tagihan':'Estimasi sementara')+'</div><div class="sum-value">'+(missingPrice?'Belum final':rp(total))+'</div></div>'+
   '<div class="summary-box"><div class="sum-label">Total barang + fee</div><div class="sum-value">'+rp(goods+fees)+'</div></div>'+
   '<div class="summary-box"><div class="sum-label">Sudah dibayar / DP</div><div class="sum-value">'+rp(paid)+'</div></div>'+
   '<div class="summary-box"><div class="sum-label">Sisa estimasi</div><div class="sum-value">'+(missingPrice?'Belum final':rp(balance))+'</div></div>'+
   '<div class="summary-box"><div class="sum-label">Ongkir</div><div class="sum-value">'+(allShippingKnown?rp(shipping):'Belum diketahui')+'</div></div></div>';
 const eventHtml=groups.map(g=>{
  const orders=g.orders||[];
  const itemHtml=orders.length?orders.map(o=>{
   const qty=Math.max(1,Number(o.qty)||1),price=Math.max(0,Number(o.price)||0),fee=Math.max(0,Number(o.fee)||0),hasItemPrice=price>0;
   const title=[o.brand,o.item].filter(Boolean).join(' · ')||'Item pesanan';
   const meta=[o.size?'Size: '+esc(o.size):'',o.colour?'Warna: '+esc(o.colour):'','Qty: '+qty].filter(Boolean).join(' · ');
   return '<div class="item"><div class="itemhead"><div class="itemname">'+esc(title)+'</div><div class="itemprice">'+(hasItemPrice?rp(price)+'<div class="meta">per item</div>':'Harga belum diisi')+'</div></div>'+
   '<div class="meta">'+meta+'</div><div class="itembottom"><span class="pill '+cls(o.status)+'">'+esc(statusLabel[o.status]||o.status||'Status belum tersedia')+'</span><div class="subtotal">Subtotal barang<b>'+(hasItemPrice?rp(price*qty):'Belum tersedia')+'</b>'+(fee?'<div class="meta">Fee jastip: '+rp(fee)+'</div>':'')+'</div></div></div>';
  }).join(''):'<div class="sub" style="padding:12px 0">Belum ada item untuk event ini.</div>';
  return '<div class="section-label">'+esc(g.event_name||g.name||'Event')+'</div>'+itemHtml;
 }).join('');
 host.innerHTML='<h2 class="greeting">Halo, '+esc(data.customer_name||'Customer')+'!</h2><p class="sub">Ini ringkasan pesanan kamu dari '+groups.length+' event.</p>'+summary+'<div class="section-label">Daftar pesanan per event</div>'+eventHtml+'<p class="note">'+(finalKnown?'Total mengikuti data tagihan saat ini.':'Perhitungan ini belum final dan dapat berubah saat harga atau ongkir dilengkapi.')+' Total tidak memasukkan barang yang dibatalkan atau tidak berhasil didapat. Ongkir ditampilkan terpisah jika belum diketahui. Data diperbarui dari sistem jastip.</p><p class="sub" style="margin:14px 0 0">Untuk koreksi pesanan atau pembayaran, silakan hubungi admin.</p>';
}
(async()=>{const host=document.getElementById('content');const t=new URLSearchParams(location.search).get('t');if(!t){host.innerHTML='<div class="error">Link rekapan tidak lengkap. Minta link terbaru kepada admin jastip.</div>';return}try{const client=window.supabase.createClient(SUPABASE_URL,KEY);const {data,error}=await client.rpc('get_customer_event_share',{p_token:t});if(error)throw error;if(!data||data.error||(!Array.isArray(data.orders)&&!Array.isArray(data.events))){host.innerHTML='<div class="error">Link tidak valid, sudah dicabut, atau belum tersedia. Minta admin jastip membuat link baru.</div>';return}renderRecap(data)}catch(e){console.error(e);host.innerHTML='<div class="error">Rekapan belum bisa dimuat. Pastikan admin sudah mengaktifkan fitur link rekapan. Jika masalah berlanjut, minta link baru.</div>'}})();
</script></body></html>
