<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekapan Pesanan | Jastip Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#282522;--muted:#77716b;--accent:#7b5c4f;--line:#e9e2dd;--green:#e5f5ea;--red:#fde7e5;--yellow:#fff3cf;--blue:#e8f0fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}.brand{font-size:12px;letter-spacing:1.5px;font-weight:900;color:var(--accent)}h1{font-size:25px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:14px}.event{font-size:14px;color:var(--muted)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemname{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-top:8px}.good{background:var(--green);color:#277146}.wait{background:var(--yellow);color:#8b6815}.bad{background:var(--red);color:#9a4139}.ship{background:var(--blue);color:#3f6194}.error{padding:20px;background:#fff;border-radius:14px;color:#8a3d37}.foot{margin-top:18px;font-size:11px;color:var(--muted);text-align:center}
</style></head><body><main class="wrap"><div class="brand">JASTIP MANAGER</div><h1>Rekapan Pesanan</h1><div class="sub">Link ini bersifat pribadi dan hanya menampilkan pesanan pada satu event.</div><div id="content" class="card">Memuat rekapan…</div><div class="foot">Jika status belum berubah, muat ulang halaman ini untuk melihat data terbaru.</div></main><script>
const URL='https://aewcrqgknlntmacrlvhd.supabase.co';const KEY='sb_publishable_30ODyszcxUi54JJyYByfdQ_q_RCEysm';
const statusLabel={'Request':'Menunggu konfirmasi / masih dicari','PO':'Menunggu konfirmasi / masih dicari','Dapat':'Berhasil didapat','Tidak Dapat':'Tidak berhasil didapat / sold out','OTW ke Aku':'Dalam perjalanan ke jastiper','Ready':'Barang sudah sampai di jastiper','Sent':'Sudah dikirim','Completed':'Selesai','Cancelled':'Dibatalkan'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(s){if(['Dapat','Ready','Completed'].includes(s))return'good';if(['Tidak Dapat','Cancelled'].includes(s))return'bad';if(['OTW ke Aku','Sent'].includes(s))return'ship';return'wait'}
(async()=>{const host=document.getElementById('content');const t=new URLSearchParams(location.search).get('t');if(!t){host.innerHTML='<div class="error">Link rekapan tidak lengkap. Minta link terbaru kepada admin jastip.</div>';return}try{const client=window.supabase.createClient(URL,KEY);const {data,error}=await client.rpc('get_customer_event_share',{p_token:t});if(error)throw error;if(!data||data.error||!Array.isArray(data.orders)){host.innerHTML='<div class="error">Link tidak valid, sudah dicabut, atau belum tersedia. Minta admin jastip membuat link baru.</div>';return}host.innerHTML='<div class="event">Event: <b>'+esc(data.event_name||'PO')+'</b></div><h2 style="font-size:19px;margin:8px 0 0">Halo, '+esc(data.customer_name||'Customer')+'!</h2><p class="sub">Berikut status pesanan kamu saat ini.</p>'+(data.orders.length?data.orders.map(o=>'<div class="item"><div class="itemname">'+esc([o.brand,o.item].filter(Boolean).join(' · ')||'Item pesanan')+'</div><div class="meta">'+(o.size?('Size: '+esc(o.size)+' · '):'')+(o.colour?('Warna: '+esc(o.colour)+' · '):'')+'Qty: '+esc(o.qty||1)+'</div><span class="pill '+cls(o.status)+'">'+esc(statusLabel[o.status]||o.status||'Status belum tersedia')+'</span></div>').join(''):'<div class="sub" style="padding:18px 0">Belum ada item untuk ditampilkan.</div>')+'<p class="sub" style="margin-bottom:0">Status di atas diperbarui dari data jastip. Untuk perubahan pesanan, silakan hubungi admin.</p>';}catch(e){console.error(e);host.innerHTML='<div class="error">Rekapan belum bisa dimuat. Pastikan admin sudah mengaktifkan fitur link rekapan. Jika masalah berlanjut, minta link baru.</div>'}})();
</script></body></html>
